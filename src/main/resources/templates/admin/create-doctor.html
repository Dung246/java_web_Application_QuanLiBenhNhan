<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cấp Tài Khoản Bác Sĩ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg, #dbeafe, #f0fdf4);
            min-height: 100vh;
        }

        .doctor-card{
            max-width: 650px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title{
            color: #0f766e;
            font-weight: 700;
        }

        .form-label{
            color: #374151;
        }

        .form-control,
        .form-select{
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            transition: 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus{
            border-color: #14b8a6;
            box-shadow: 0 0 0 0.2rem rgba(20,184,166,0.2);
        }

        .form-check-input:checked{
            background-color: #14b8a6;
            border-color: #14b8a6;
        }

        .btn-create{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-create:hover{
            transform: translateY(-2px);
            opacity: 0.95;
        }

        .btn-back{
            border-radius: 12px;
            padding: 11px;
            font-weight: 500;
        }

        hr{
            border-top: 2px dashed #cbd5e1;
        }

        .form-control.is-invalid,
        .form-select.is-invalid {
            background-image: none !important;
            padding-right: 0.75rem !important;
            border-color: #ef4444;
        }

        .text-danger{
            font-size: 0.85rem;
        }
    </style>
</head>

<body class="py-5">

<div class="container doctor-card p-4 mx-auto">

    <h3 class="text-center mb-4 title">
        Tạo Tài Khoản Bác Sĩ
    </h3>

    <form th:action="@{/admin/doctor/create}" method="post" th:object="${dto}">

        <div class="mb-3">
            <label class="form-label fw-bold">Họ và tên Bác sĩ</label>

            <input type="text"
                   name="fullName"
                   class="form-control"
                   placeholder="Nhập họ tên bác sĩ..."
                   th:value="*{fullName}"
                   th:classappend="${nameError} ? 'is-invalid' : ''">

            <div class="text-danger mt-1"
                 th:if="${nameError}"
                 th:text="${nameError}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block fw-bold">Giới tính</label>

            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       name="gender"
                       id="male"
                       value="Nam"
                       th:checked="*{gender == 'Nam'}">

                <label class="form-check-label" for="male">Nam</label>
            </div>

            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       name="gender"
                       id="female"
                       value="Nữ"
                       th:checked="*{gender == 'Nữ'}">

                <label class="form-check-label" for="female">Nữ</label>
            </div>

            <div class="text-danger mt-1"
                 th:if="${genderError}"
                 th:text="${genderError}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Chuyên khoa phụ trách</label>

            <select name="specialtyId"
                    class="form-select"
                    th:classappend="${specialtyError} ? 'is-invalid' : ''">

                <option value="">-- Chọn chuyên khoa --</option>

                <option th:each="s : ${specialties}"
                        th:value="${s.id}"
                        th:text="${s.name}"
                        th:selected="${dto.specialtyId != null and dto.specialtyId == s.id}">
                </option>
            </select>

            <div class="text-danger mt-1"
                 th:if="${specialtyError}"
                 th:text="${specialtyError}">
            </div>
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Email</label>

                <input type="text"
                       name="email"
                       class="form-control"
                       placeholder="....@gmail.com"
                       th:value="*{email}"
                       th:classappend="${emailError} ? 'is-invalid' : ''">

                <div class="text-danger mt-1"
                     th:if="${emailError}"
                     th:text="${emailError}">
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Số điện thoại</label>

                <input type="text"
                       name="phone"
                       class="form-control"
                       placeholder="0123456789"
                       th:value="*{phone}"
                       th:classappend="${phoneError} ? 'is-invalid' : ''">

                <div class="text-danger mt-1"
                     th:if="${phoneError}"
                     th:text="${phoneError}">
                </div>
            </div>

        </div>

        <hr class="my-4">

        <div class="mb-3">
            <label class="form-label fw-bold">Tên đăng nhập</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Nhập username..."
                   th:value="*{username}"
                   th:classappend="${usernameError} ? 'is-invalid' : ''">

            <div class="text-danger mt-1"
                 th:if="${usernameError}"
                 th:text="${usernameError}">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">Mật khẩu khởi tạo</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="••••••••"
                   th:classappend="${passwordError} ? 'is-invalid' : ''">

            <div class="text-danger mt-1"
                 th:if="${passwordError}"
                 th:text="${passwordError}">
            </div>
        </div>

        <button type="submit" class="btn btn-create text-white w-100">
            Cấp tài khoản
        </button>

        <a th:href="@{/admin/doctors}"
           class="btn btn-outline-secondary btn-back w-100 mt-3">
            Hủy / Quay lại
        </a>

    </form>

</div>

</body>
</html>
