<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Bệnh nhân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body{
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #ecfeff, #f0fdf4);
            font-family: 'Segoe UI', sans-serif;
        }

        .page-title{
            color: #0f766e;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold page-title">
            <i class="fa-solid fa-hospital-user me-2"></i>
            Quản lý Bệnh nhân
        </h2>

        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
            Quay lại
        </a>

    </div>

    <div class="table-responsive shadow-sm rounded-4 bg-white p-3">

        <table class="table table-hover align-middle">

            <thead class="table-light">

            <tr>
                <th>Tên Bệnh Nhân</th>
                <th>Số điện thoại</th>
                <th>Địa chỉ</th>
                <th>Thao tác</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="p : ${patients}">

                <td class="fw-bold"
                    th:text="${p.profile.fullName}">
                </td>

                <td th:text="${p.profile.phone}"></td>

                <td th:text="${p.profile.address}"></td>

                <td>

                    <a th:href="@{/admin/patients/{id}(id=${p.id})}"

                       class="btn btn-sm btn-outline-success">

                        <i class="fa-solid fa-eye me-1"></i>
                        Xem Lịch Khám

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
