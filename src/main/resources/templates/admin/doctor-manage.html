<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý Bác sĩ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body{
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #ecfeff, #f0fdf4);
            font-family: 'Segoe UI', sans-serif;
        }

        .page-title{
            color: #0f766e;
            font-weight: 700;
        }

        .top-btn{
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .top-btn:hover{
            transform: translateY(-2px);
        }

        .btn-create{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            border: none;
        }

        .btn-create:hover{
            opacity: 0.95;
        }

        .dashboard-btn{
            background: #64748b;
            border: none;
        }

        .dashboard-btn:hover{
            background: #475569;
        }

        .doctor-table{
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .table{
            border-radius: 16px;
            overflow: hidden;
        }

        .table thead{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            color: white;
        }

        .table thead th{
            border: none;
            padding: 16px;
            font-size: 15px;
        }

        .table tbody td{
            vertical-align: middle;
            padding: 16px 12px;
        }

        .table-hover tbody tr:hover{
            background: #f0fdfa;
            transition: 0.2s ease;
        }

        .doctor-name{
            color: #1e293b;
            font-weight: 600;
        }

        .badge{
            font-size: 13px;
            padding: 8px 14px;
        }

        .btn-action{
            border-radius: 30px;
            font-weight: 600;
            padding: 8px 16px;
            transition: 0.25s ease;
        }

        .btn-action:hover{
            transform: scale(1.04);
        }

        .alert{
            border-radius: 14px;
            border: none;
            background: #dcfce7;
            color: #166534;
            font-weight: 500;
        }

    </style>
</head>

<body>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="page-title">
            <i class="fa-solid fa-user-md me-2"></i>
            Danh sách Bác sĩ
        </h2>

        <div class="d-flex gap-2">

            <a th:href="@{/admin/doctor/create}"
               class="btn btn-create text-white shadow-sm top-btn">

                <i class="fa-solid fa-plus me-1"></i>
                Cấp tài khoản mới
            </a>

            <a th:href="@{/admin/dashboard}"
               class="btn dashboard-btn text-white shadow-sm top-btn">

                <i class="fa-solid fa-house me-1"></i>
                Dashboard
            </a>

        </div>

    </div>

    <div th:if="${param.success}"
         class="alert shadow-sm mb-4">

        <i class="fa-solid fa-circle-check me-2"></i>
        Đã cấp tài khoản bác sĩ thành công!

    </div>

    <div class="doctor-table">

        <div class="table-responsive">

            <table class="table table-hover align-middle mb-0 text-center">

                <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ và Tên Bác Sĩ</th>
                    <th>Tài khoản</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="d, iter : ${doctors}">

                    <td th:text="${iter.count}"></td>

                    <td class="doctor-name text-start"
                        th:text="${d.profile.fullName}">
                    </td>

                    <td th:text="${d.username}"></td>

                    <td>

                        <span th:if="${d.enabled}"
                              class="badge bg-success rounded-pill">

                            Đang hoạt động

                        </span>

                        <span th:if="${!d.enabled}"
                              class="badge bg-danger rounded-pill">

                            Đang bị khóa

                        </span>

                    </td>

                    <td>

                        <a th:href="@{/admin/doctor/toggle-status/{id}(id=${d.id})}"

                           class="btn btn-sm btn-action"

                           th:classappend="${d.enabled}
                           ? 'btn-outline-danger'
                           : 'btn-outline-success'">

                            <i class="fa-solid me-1"
                               th:classappend="${d.enabled}
                               ? 'fa-lock'
                               : 'fa-lock-open'">
                            </i>

                            <span th:text="${d.enabled}
                            ? 'Khóa TK'
                            : 'Mở Khóa'">
                            </span>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
