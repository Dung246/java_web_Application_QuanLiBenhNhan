<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết Bệnh nhân</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #ecfeff, #f0fdf4);
            font-family: 'Segoe UI', sans-serif;
        }

        .patient-card{
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card-header-custom{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            color: white;
            padding: 22px;
        }

        .card-header-custom h4{
            margin: 0;
            font-weight: 700;
        }

        .info-label{
            color: #0f172a;
            font-weight: 700;
        }

        .info-text{
            color: #475569;
        }

        .info-box{
            padding: 10px 18px;
        }

        .section-title{
            color: #0f766e;
            font-weight: 700;
        }

        .table-wrapper{
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .table{
            border-radius: 16px;
            overflow: hidden;
        }

        .table thead{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            color: white;
        }

        .table thead th{
            border: none;
            padding: 16px;
        }

        .table tbody td{
            padding: 16px 12px;
            vertical-align: middle;
        }

        .table-hover tbody tr:hover{
            background: #f0fdfa;
            transition: 0.2s ease;
        }

        .badge-count{
            background: linear-gradient(135deg, #14b8a6, #0ea5e9);
            color: white;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 14px;
        }

        .btn-back{
            background: #64748b;
            border: none;
            color: white;
            border-radius: 12px;
            padding: 10px 22px;
            font-weight: 600;
            transition: 0.25s ease;
        }

        .btn-back:hover{
            background: #475569;
            color: white;
            transform: translateY(-2px);
        }

        .badge-status-pending{
            background: #fef3c7;
            color: #92400e;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

        .badge-status-completed{
            background: #dcfce7;
            color: #166534;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

    </style>
</head>

<body>

<div class="container py-5">

    <!-- THÔNG TIN BỆNH NHÂN -->
    <div class="card patient-card mb-4">

        <div class="card-header-custom">

            <h4>
                Thông tin chi tiết:
                <span th:text="${patient.profile.fullName}"></span>
            </h4>

        </div>

        <div class="card-body p-4">

            <div class="row">

                <div class="col-md-4 border-end info-box">

                    <p>
                        <span class="info-label">Ngày sinh:</span>
                        <span class="info-text"
                              th:text="${patient.profile.dateOfBirth}">
                        </span>
                    </p>

                    <p>
                        <span class="info-label">Giới tính:</span>
                        <span class="info-text"
                              th:text="${patient.profile.gender}">
                        </span>
                    </p>

                </div>

                <div class="col-md-4 border-end info-box">

                    <p>
                        <span class="info-label">Điện thoại:</span>
                        <span class="info-text"
                              th:text="${patient.profile.phone}">
                        </span>
                    </p>

                    <p>
                        <span class="info-label">Địa chỉ:</span>
                        <span class="info-text"
                              th:text="${patient.profile.address}">
                        </span>
                    </p>

                </div>

                <div class="col-md-4 info-box">

                    <p>
                        <span class="info-label">Tổng số lần khám:</span>

                        <span class="badge-count"
                              th:text="${appointments.size()}">
                        </span>
                    </p>

                </div>

            </div>

        </div>

    </div>

    <!-- LỊCH SỬ KHÁM -->
    <h4 class="section-title mb-3">
        Lịch sử khám & Hẹn lịch
    </h4>

    <div class="table-wrapper">

        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead>

                <tr>
                    <th>Ngày/Giờ</th>
                    <th>Bác sĩ phụ trách</th>
                    <th>Chuyên khoa</th>
                    <th>Trạng thái</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="a : ${appointments}">

                    <td th:text="${a.appointmentDate + ' ' + a.appointmentTime}"></td>

                    <td th:text="${'BS. ' + a.doctor.profile.fullName}"></td>

                    <td th:text="${a.specialty.name}"></td>

                    <td>

                        <span th:if="${a.status == 'PENDING'}"
                              class="badge-status-pending">

                            Chờ khám

                        </span>

                        <span th:if="${a.status == 'COMPLETED'}"
                              class="badge-status-completed">

                            Đã khám xong

                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <a th:href="@{/admin/patients}"
       class="btn btn-back mt-4">

        Quay lại danh sách

    </a>

</div>

</body>
</html>
