<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hệ thống Quản trị - Smart Healthcare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

        body{
            background: linear-gradient(135deg, #000000, #111827, #1f2937);
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .hero-section{
            background: linear-gradient(135deg, #000000 0%, #111827 50%, #1e293b 100%);
            color: white;
            padding: 60px 0;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .admin-card{
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            transition: 0.3s;
            cursor: pointer;
            height: 100%;
            background: rgba(17,24,39,0.95);
            backdrop-filter: blur(10px);
            color: white;
        }

        .admin-card:hover{
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.45);
            border-color: rgba(255,255,255,0.15);
        }

        .icon-box{
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: 0 auto 20px;
        }

        .admin-card h5{
            color: #f3f4f6;
        }

    </style>
</head>
<body>
<div class="hero-section text-center position-relative">
    <a th:href="@{/logout}" class="btn btn-danger position-absolute top-0 end-0 m-4 shadow-sm">
        <i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất
    </a>
    <div class="container pt-3">
        <h1 class="fw-bold">SMART HEALTHCARE ADMIN</h1>
        <p class="lead opacity-75">Hệ thống quản lý trung tâm y tế thông minh</p>
    </div>
</div>

<div class="container mt-n5" style="margin-top: -40px;">
    <div class="row g-4 justify-content-center">
        <div class="col-md-3">
            <div class="card admin-card shadow-sm text-center p-4" onclick="location.href='/admin/doctors'">
                <div class="icon-box bg-primary text-white"><i class="fa-solid fa-user-md"></i></div>
                <h5 class="fw-bold">Quản Lý Bác Sĩ</h5>
                <span class="btn btn-primary rounded-pill mt-2">Truy cập</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card admin-card shadow-sm text-center p-4" onclick="location.href='/admin/patients'">
                <div class="icon-box bg-success text-white"><i class="fa-solid fa-hospital-user"></i></div>
                <h5 class="fw-bold">Quản Lý Bệnh Nhân</h5>
                <span class="btn btn-success rounded-pill mt-2">Truy cập</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card admin-card shadow-sm text-center p-4" onclick="location.href='/admin/medicines'">
                <div class="icon-box bg-warning text-dark"><i class="fa-solid fa-pills"></i></div>
                <h5 class="fw-bold">Danh Mục Thuốc</h5>
                <span class="btn btn-warning rounded-pill mt-2">Truy cập</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card admin-card shadow-sm text-center p-4" onclick="location.href='/admin/prescriptions'">
                <div class="icon-box bg-info text-white"><i class="fa-solid fa-prescription-bottle-medical"></i></div>
                <h5 class="fw-bold">Cấp Phát Thuốc</h5>
                <span class="btn btn-info text-white rounded-pill mt-2">Truy cập</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
